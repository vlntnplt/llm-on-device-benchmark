      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

<style title='marimo-custom'>/* Styles for the exported report (App(css_file=...)).

   Two jobs: make the Vega charts legible on a dark background, and drive the
   static switchers in bench_analysis.switcher. Both work with no kernel — the
   export is plain HTML, so everything here is CSS only. */

:root {
  --sw-accent: #2a9d8f;
  --sw-border: #d6dade;
  --sw-fg: #4b5563;
  --sw-muted: #8a939b;
  --sw-active-bg: #eef2f6;
  --sw-active-fg: #14532d;
}

.dark {
  --sw-border: #3a424b;
  --sw-fg: #9aa3ab;
  --sw-active-bg: #24303a;
  --sw-active-fg: #7fd1c4;
}

/* Chart colours are not set here. marimo hands Vega its own dark theme when the
   resolved theme is dark (`[tool.marimo.display] theme` in pyproject.toml), and
   it renders outputs into a shadow root that page CSS cannot reach anyway. */

/* ── Prose measure ────────────────────────────────────────────────────────────
   The app is laid out wide enough for the charts, which leaves the text running
   the full width — a long line is hard to track back to the next one. Cap the
   running text (not tables or charts, which need the room) and close the leading
   marimo's prose default opens up. */
.markdown p,
.markdown li,
.markdown blockquote,
.markdown h1,
.markdown h2,
.markdown h3 {
  max-width: 64ch;
}

.markdown p,
.markdown li {
  line-height: 1.5;
}

.markdown li + li,
.markdown p + p {
  margin-top: 0.5em;
}

/* One completion per task, folded away until asked for. <details> is native, so
   it opens with no runtime behind it. */
.sample-completions {
  max-width: 64ch;
  margin: 0.5rem 0 1rem;
  font-size: 0.875rem;
}

.sample-completions summary {
  cursor: pointer;
  color: var(--sw-fg);
}

.sample-completions blockquote {
  margin: 0.5rem 0 0.9rem;
  padding-left: 0.75rem;
  border-left: 2px solid var(--sw-border);
  color: var(--sw-fg);
}

.sample-completions .who {
  display: block;
  font-size: 0.8125rem;
  color: var(--sw-muted);
  margin-bottom: 0.15rem;
}

/* ── Static switchers ─────────────────────────────────────────────────────────
   Radios are visually hidden but still focusable, so the tabs stay keyboard- and
   screen-reader-navigable. Per-group rules (which panel to reveal, which label to
   highlight) are generated alongside each group — see switcher.tabs. */
.sw-radio {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.sw-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.25rem;
  align-items: center;
  margin: 0 0 0.75rem;
}

.sw-legend {
  font-size: 0.8125rem;
  color: var(--sw-muted);
  margin-right: 0.25rem;
}

.sw-tab {
  cursor: pointer;
  user-select: none;
  padding: 0.25rem 0.7rem;
  border-radius: 0.375rem;
  border: 1px solid var(--sw-border);
  font-size: 0.8125rem;
  line-height: 1.4;
  color: var(--sw-fg);
  background: transparent;
}

.sw-tab:hover {
  border-color: var(--sw-accent);
}

.sw-radio:focus-visible + .sw-tab,
.sw-radio:focus-visible ~ .sw-bar .sw-tab {
  outline: 2px solid var(--sw-accent);
  outline-offset: 2px;
}

.sw-panel {
  display: none;
}
</style></head>

            "session": {"cells": [{"code_hash": "9d0b7e664258f80aeb007d063d1d3946", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "89cef66fc2cbbf6d44f7cdcb7c44f39c", "console": [], "id": "MJUe", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"on-device-llm-inference-benchmark\"\u003EOn-device LLM inference benchmark\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EWhat does it cost to run a small LLM on the machines people actually own?\nOne inference stack \u2014 \u003Ca href=\"https://github.com/ggml-org/llama.cpp\" rel=\"noopener noreferrer\" target=\"_blank\"\u003Ellama.cpp\u003C/a\u003E\n\u2014 measured the same way on every contributed machine, on its GPU and on\nits CPU. Every number on this page is computed from the published runs in\n\u003Ccode\u003Eresults/published/\u003C/code\u003E; nothing is quoted from spec sheets.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EModels\u003C/strong\u003E compares the models measured. \u003Cstrong\u003EFleet\u003C/strong\u003E works toward the real\nquestion \u2014 \u003Cem\u003Ehow much of a device fleet could run this model, acceptably?\u003C/em\u003E\n\u003Cstrong\u003EExplore\u003C/strong\u003E holds everything measured, chart by chart.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "5fec8c91b0cd4542df983318a3fa16ba", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "4284baf699a58b56954c790516356925", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "319cc25c8e9e038dd92593875d63427c", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "0f9a20b5ac7a9a2ad0ad30afe5ce40ee", "console": [], "id": "PKri", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "f1bfebfefc14e30556a485fa59350699", "console": [], "id": "Xref", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "75c1d6df1518c3d522a8f437990f3fd9", "console": [], "id": "SFPL", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e9d5f6483cda9ecf52c774fbcc9bb7b8", "console": [], "id": "BYtC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "952d3f2d0f00490d23e84875c35a8a90", "console": [], "id": "RGSE", "outputs": [{"data": {"text/html": "\u003Cstyle\u003E#main-models:checked~.sw-body [data-p=main-models]{display:block}#main-models:checked~.sw-bar [for=main-models]{background:var(--sw-active-bg);border-color:var(--sw-accent);color:var(--sw-active-fg);font-weight:600}#main-fleet:checked~.sw-body [data-p=main-fleet]{display:block}#main-fleet:checked~.sw-bar [for=main-fleet]{background:var(--sw-active-bg);border-color:var(--sw-accent);color:var(--sw-active-fg);font-weight:600}#main-explore:checked~.sw-body [data-p=main-explore]{display:block}#main-explore:checked~.sw-bar [for=main-explore]{background:var(--sw-active-bg);border-color:var(--sw-accent);color:var(--sw-active-fg);font-weight:600}\u003C/style\u003E\u003Cdiv class=\"sw-group\"\u003E\u003Cinput class=\"sw-radio\" type=\"radio\" name=\"main\" id=\"main-models\" checked\u003E\u003Cinput class=\"sw-radio\" type=\"radio\" name=\"main\" id=\"main-fleet\"\u003E\u003Cinput class=\"sw-radio\" type=\"radio\" name=\"main\" id=\"main-explore\"\u003E\u003Cdiv class=\"sw-bar\"\u003E\u003Clabel class=\"sw-tab\" for=\"main-models\"\u003EModels\u003C/label\u003E\u003Clabel class=\"sw-tab\" for=\"main-fleet\"\u003EFleet\u003C/label\u003E\u003Clabel class=\"sw-tab\" for=\"main-explore\"\u003EExplore\u003C/label\u003E\u003C/div\u003E\u003Cdiv class=\"sw-body\"\u003E\u003Cdiv class=\"sw-panel\" data-p=\"main-models\"\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EEach model, reduced to the numbers that decide whether and how it runs.\n\u003Cstrong\u003EOn disk\u003C/strong\u003E is the download; \u003Cstrong\u003Estreamed per token\u003C/strong\u003E is the weight bytes a\nsingle decoded token actually reads \u2014 with the KV cache growth, it sets\ndecode speed on any machine (decode is memory-bound: tokens/s \u2248 effective\nmemory bandwidth \u00f7 bytes per token). \u003Cstrong\u003EKV per 1k tokens\u003C/strong\u003E is how the\nfootprint grows with context; a \"state\" term is a recurrent architecture's\nconstant. \u003Cstrong\u003EFits 8 / 16 GB\u003C/strong\u003E allows 4k context and ~1 GB of runtime\noverhead.\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003Emodel\u003C/th\u003E\n\u003Cth\u003Eon disk\u003C/th\u003E\n\u003Cth\u003Estreamed per token\u003C/th\u003E\n\u003Cth\u003EKV per 1k tokens\u003C/th\u003E\n\u003Cth\u003Efits 8 / 16 GB\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003EQwen3.5-4B\u003C/strong\u003E q4\u003C/td\u003E\n\u003Ctd\u003E2.6 GB\u003C/td\u003E\n\u003Ctd\u003E2.1 GB\u003C/td\u003E\n\u003Ctd\u003E34 MB + 53 MB state\u003C/td\u003E\n\u003Ctd\u003E\u2713 / \u2713\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003Egemma4-E2B\u003C/strong\u003E q4\u003C/td\u003E\n\u003Ctd\u003E2.9 GB\u003C/td\u003E\n\u003Ctd\u003E1.2 GB\u003C/td\u003E\n\u003Ctd\u003E19 MB\u003C/td\u003E\n\u003Ctd\u003E\u2713 / \u2713\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003Egemma4-E2B-qat\u003C/strong\u003E q2\u003C/td\u003E\n\u003Ctd\u003E1.7 GB\u003C/td\u003E\n\u003Ctd\u003E0.8 GB\u003C/td\u003E\n\u003Ctd\u003E19 MB\u003C/td\u003E\n\u003Ctd\u003E\u2713 / \u2713\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cstrong\u003Egemma4-E4B\u003C/strong\u003E q4\u003C/td\u003E\n\u003Ctd\u003E4.6 GB\u003C/td\u003E\n\u003Ctd\u003E2.5 GB\u003C/td\u003E\n\u003Ctd\u003E59 MB\u003C/td\u003E\n\u003Ctd\u003E\u2713 / \u2713\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EThe cards below add what each model measured on the machines we have \u2014\nreal rates on real silicon, the job's end-to-end numbers, and any\ncaveats the runs surfaced.\u003C/span\u003E\u003C/span\u003E\u003Cstyle\u003E#cards-qwen3-5-4b:checked~.sw-body [data-p=cards-qwen3-5-4b]{display:block}#cards-qwen3-5-4b:checked~.sw-bar [for=cards-qwen3-5-4b]{background:var(--sw-active-bg);border-color:var(--sw-accent);color:var(--sw-active-fg);font-weight:600}#cards-gemma4-e2b:checked~.sw-body [data-p=cards-gemma4-e2b]{display:block}#cards-gemma4-e2b:checked~.sw-bar [for=cards-gemma4-e2b]{background:var(--sw-active-bg);border-color:var(--sw-accent);color:var(--sw-active-fg);font-weight:600}#cards-gemma4-e2b-qat:checked~.sw-body [data-p=cards-gemma4-e2b-qat]{display:block}#cards-gemma4-e2b-qat:checked~.sw-bar [for=cards-gemma4-e2b-qat]{background:var(--sw-active-bg);border-color:var(--sw-accent);color:var(--sw-active-fg);font-weight:600}#cards-gemma4-e4b:checked~.sw-body [data-p=cards-gemma4-e4b]{display:block}#cards-gemma4-e4b:checked~.sw-bar [for=cards-gemma4-e4b]{background:var(--sw-active-bg);border-color:var(--sw-accent);color:var(--sw-active-fg);font-weight:600}\u003C/style\u003E\u003Cdiv class=\"sw-group\"\u003E\u003Cinput class=\"sw-radio\" type=\"radio\" name=\"cards\" id=\"cards-qwen3-5-4b\" checked\u003E\u003Cinput class=\"sw-radio\" type=\"radio\" name=\"cards\" id=\"cards-gemma4-e2b\"\u003E\u003Cinput class=\"sw-radio\" type=\"radio\" name=\"cards\" id=\"cards-gemma4-e2b-qat\"\u003E\u003Cinput class=\"sw-radio\" type=\"radio\" name=\"cards\" id=\"cards-gemma4-e4b\"\u003E\u003Cdiv class=\"sw-bar\"\u003E\u003Clabel class=\"sw-tab\" for=\"cards-qwen3-5-4b\"\u003EQwen3.5-4B\u003C/label\u003E\u003Clabel class=\"sw-tab\" for=\"cards-gemma4-e2b\"\u003Egemma4-E2B\u003C/label\u003E\u003Clabel class=\"sw-tab\" for=\"cards-gemma4-e2b-qat\"\u003Egemma4-E2B-qat\u003C/label\u003E\u003Clabel class=\"sw-tab\" for=\"cards-gemma4-e4b\"\u003Egemma4-E4B\u003C/label\u003E\u003C/div\u003E\u003Cdiv class=\"sw-body\"\u003E\u003Cdiv class=\"sw-panel\" data-p=\"cards-qwen3-5-4b\"\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv class=\"language-scdoc highlight\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E**Footprint** \u2014 2.6 GB on disk;\n2.1 GB streamed per decoded token;\nKV 34 MB per 1k tokens of context plus a 53 MB recurrent state.\n\n**Measured on our machines** \u2014 the validation job (a \u22481.7k-token\nprompt, 256 decoded tokens), per lane:\n\n| lane | quant | prefill tok/s | decode tok/s | time to first token |\n|---|---|---|---|---|\n| Intel Graphics \u00b7 gpu | q4 | 119 | 6 | 13.3 s |\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003E| Core Ultra 5 125U \u00b7 cpu | q4 | 49 | 11 | 32.4 s |\n| Radeon 780M \u00b7 gpu | q4 | 377 | 21 | 4.2 s |\n| Ryzen 7 255 \u00b7 cpu | q4 | 95 | 17 | 16.6 s |\n| RTX 5080 \u00b7 gpu | q4 | 8,617 | 195 | 0.2 s |\n| Ryzen 9 9950X \u00b7 cpu | q4 | 257 | 16 | 6.1 s |\u003C/span\u003E\n\u003Cdiv class=\"language-scdoc highlight\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003EFull curves \u2014 how these rates move with context length \u2014 are in\n**Explore**.\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv class=\"sw-panel\" data-p=\"cards-gemma4-e2b\"\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv class=\"language-scdoc highlight\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E**Footprint** \u2014 2.9 GB on disk;\n1.2 GB streamed per decoded token;\nKV 19 MB per 1k tokens of context.\n\n**Measured on our machines** \u2014 the validation job (a \u22481.7k-token\nprompt, 256 decoded tokens), per lane:\n\n| lane | quant | prefill tok/s | decode tok/s | time to first token |\n|---|---|---|---|---|\n| Intel Graphics \u00b7 gpu | q4 | 99 | 7 | 15.8 s |\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003E| Core Ultra 5 125U \u00b7 cpu | q4 | 112 | 17 | 13.9 s |\n| Radeon 780M \u00b7 gpu | q4 | 722 | 39 | 2.2 s |\n| Ryzen 7 255 \u00b7 cpu | q4 | 254 | 30 | 6.1 s |\n| RTX 5080 \u00b7 gpu | q4 | 15,729 | 256 | 0.1 s |\n| Ryzen 9 9950X \u00b7 cpu | q4 | 655 | 31 | 2.4 s |\u003C/span\u003E\n\u003Cdiv class=\"language-scdoc highlight\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003EFull curves \u2014 how these rates move with context length \u2014 are in\n**Explore**.\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv class=\"sw-panel\" data-p=\"cards-gemma4-e2b-qat\"\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv class=\"language-scdoc highlight\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E**Footprint** \u2014 1.7 GB on disk;\n0.8 GB streamed per decoded token;\nKV 19 MB per 1k tokens of context.\n\n**Measured on our machines** \u2014 the validation job (a \u22481.7k-token\nprompt, 256 decoded tokens), per lane:\n\n| lane | quant | prefill tok/s | decode tok/s | time to first token |\n|---|---|---|---|---|\n| Intel Graphics \u00b7 gpu | q2 | 104 | 7 | 15.0 s |\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003E| Core Ultra 5 125U \u00b7 cpu | q2 | 97 | 22 | 16.1 s |\n| Radeon 780M \u00b7 gpu | q2 | 925 | 52 | 1.7 s |\n| Ryzen 7 255 \u00b7 cpu | q2 | 216 | 40 | 7.2 s |\n| RTX 5080 \u00b7 gpu | q2 | 15,290 | 298 | 0.1 s |\n| Ryzen 9 9950X \u00b7 cpu | q2 | 642 | 45 | 2.4 s |\u003C/span\u003E\n\u003Cdiv class=\"language-scdoc highlight\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003EFull curves \u2014 how these rates move with context length \u2014 are in\n**Explore**.\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv class=\"sw-panel\" data-p=\"cards-gemma4-e4b\"\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv class=\"language-scdoc highlight\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003E**Footprint** \u2014 4.6 GB on disk;\n2.5 GB streamed per decoded token;\nKV 59 MB per 1k tokens of context.\n\n**Measured on our machines** \u2014 the validation job (a \u22481.7k-token\nprompt, 256 decoded tokens), per lane:\n\n| lane | quant | prefill tok/s | decode tok/s | time to first token |\n|---|---|---|---|---|\n| Intel Graphics \u00b7 gpu | q4 | 73 | 6 | 21.4 s |\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\n\u003Cspan class=\"paragraph\"\u003E| Core Ultra 5 125U \u00b7 cpu | q4 | 58 | 10 | 27.0 s |\n| Radeon 780M \u00b7 gpu | q4 | 369 | 21 | 4.2 s |\n| Ryzen 7 255 \u00b7 cpu | q4 | 126 | 16 | 12.4 s |\n| RTX 5080 \u00b7 gpu | q4 | 9,750 | 160 | 0.2 s |\n| Ryzen 9 9950X \u00b7 cpu | q4 | 344 | 16 | 4.5 s |\u003C/span\u003E\n\u003Cdiv class=\"language-scdoc highlight\"\u003E\u003Cpre\u003E\u003Cspan\u003E\u003C/span\u003E\u003Ccode\u003EFull curves \u2014 how these rates move with context length \u2014 are in\n**Explore**.\n\u003C/code\u003E\u003C/pre\u003E\u003C/div\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv class=\"sw-panel\" data-p=\"main-fleet\"\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe goal: describe a fleet (so many iGPU laptops, so many discrete-GPU\ndesktops, so many Macs; low/mid/high in each), describe a workload\n(prompt size, output size, context) and UX budgets (time to first token,\ntokens per second) \u2014 and read off, per model, \u003Cstrong\u003Ehow much of the fleet\nclears the bar\u003C/strong\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe mechanism: every measurement factors into \u003Cem\u003Emodel cost\u003C/em\u003E \u00d7 \u003Cem\u003Emachine\nceiling\u003C/em\u003E \u00d7 \u003Cem\u003Estack efficiency \u03b7\u003C/em\u003E. Costs are machine-independent (Models\ntab). Ceilings are three describable numbers per machine \u2014 memory,\nbandwidth, compute \u2014 which our probe measures bare. If \u03b7 transfers\nbetween machines of a class, fleets only need to be described by\nceilings, not measured.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ECalibration status: \u03b7 does not transfer well enough yet.\u003C/strong\u003E Across the\nmeasured lanes it spans:\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003Elane class\u003C/th\u003E\n\u003Cth\u003Ephase\u003C/th\u003E\n\u003Cth\u003E\u03b7 range\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Ecpu\u003C/td\u003E\n\u003Ctd\u003Edecode\u003C/td\u003E\n\u003Ctd\u003E0.33 \u2013 1.07\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Ecpu\u003C/td\u003E\n\u003Ctd\u003Eprefill\u003C/td\u003E\n\u003Ctd\u003E0.86 \u2013 1.31\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Egpu\u003C/td\u003E\n\u003Ctd\u003Edecode\u003C/td\u003E\n\u003Ctd\u003E0.18 \u2013 0.73\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Egpu\u003C/td\u003E\n\u003Ctd\u003Eprefill\u003C/td\u003E\n\u003Ctd\u003E0.46 \u2013 1.29\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EPredicting each lane from the others' \u03b7 (leave-one-out) is off by:\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003Emachine\u003C/th\u003E\n\u003Cth\u003Eprovider\u003C/th\u003E\n\u003Cth\u003Ephase\u003C/th\u003E\n\u003Cth\u003Emedian\u003C/th\u003E\n\u003Cth\u003Eworst\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Ecore-ultra-5-125u-intel-graphics\u003C/td\ el awareness\n(the q2 pack's history shows a single missing kernel breaks the bandwidth\nmodel), and an attention term in the prefill cost. The next submission \u2014\nan Apple-silicon Mac \u2014 is the held-out test: its numbers will be\npredicted from ceilings before the run, then measured.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv class=\"sw-panel\" data-p=\"main-explore\"\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"the-machines\"\u003EThe machines\u003C/h2\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003Emachine\u003C/th\u003E\n\u003Cth\u003ECPU\u003C/th\u003E\n\u003Cth\u003EGPU\u003C/th\u003E\n\u003Cth\u003Ememory\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003ECore Ultra 5 125U (Intel Graphics)\u003C/td\u003E\n\u003Ctd\u003EIntel(R) Core(TM) Ultra 5 125U\u003C/td\u003E\n\u003Ctd\u003Ecpu\u003C/td\u003E\n\u003Ctd\u003E15.1 GB, 2-ch @ 4800 MT/s\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003ERyzen 7 255 (Radeon 780M)\u003C/td\u003E\n\u003Ctd\u003EAMD Ryzen 7 255 w/ Radeon 780M Graphics\u003C/td\u003E\n\u003Ctd\u003Ecpu\u003C/td\u003E\n\u003Ctd\u003E13.4 GB, 2-ch @ 4800 MT/s\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003ERyzen 9 9950X (RTX 5080)\u003C/td\u003E\n\u003Ctd\u003EAMD Ryzen 9 9950X 16-Core Processor\u003C/td\u003E\n\u003Ctd\u003ENVIDIA GeForce RTX 5080\u003C/td\u003E\n\u003Ctd\u003E60.4 GB\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003EBefore any model is loaded, the harness measures what each provider's\nsilicon can do \u003Cstrong\u003Ebare\u003C/strong\u003E: how fast it multiplies matrices (the work of\nprompt reading) and how fast it moves memory (the work of token\ngeneration). Every model number in this report can be read against these\nceilings, so a slow curve is attributable \u2014 runtime or device \u2014 rather\nthan guessed at.\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003Emachine\u003C/th\u003E\n\u003Cth\u003Eprovider\u003C/th\u003E\n\u003Cth\u003Ematrix math TFLOP/s\u003C/th\u003E\n\u003Cth\u003Eown memory GB/s\u003C/th\u003E\n\u003Cth\u003Etransfer-in GB/s\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Ecore-ultra-5-125u-intel-graphics\u003C/td\u003E\n\u003Ctd\u003Ecpu\u003C/td\u003E\n\u003Ctd\u003E0.3\u003C/td\u003E\n\u003Ctd\u003E55\u003C/td\u003E\n\u003Ctd\u003E18.7\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Ecore-ultra-5-125u-intel-graphics\u003C/td\u003E\n\u003Ctd\u003Evulkan\u003C/td\u003E\n\u003Ctd\u003E0.5\u003C/td\u003E\n\u003Ctd\u003E57\u003C/td\u003E\n\u003Ctd\u003E9.7\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Eryzen-7-255-radeon-780m\u003C/td\u003E\n\u003Ctd\u003Ecpu\u003C/td\u003E\n\u003Ctd\u003E0.9\u003C/td\u003E\n\u003Ctd\u003E49\u003C/td\u003E\n\u003Ctd\u003E5.5\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Eryzen-7-255-radeon-780m\u003C/td\u003E\n\u003Ctd\u003Evulkan\u003C/td\u003E\n\u003Ctd\u003E3.5\u003C/td\u003E\n\u003Ctd\u003E64\u003C/td\u003E\n\u003Ctd\u003E12.7\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Eryzen-9-9950x-rtx-5080\u003C/td\u003E\n\u003Ctd\u003Ecpu\u003C/td\u003E\n\u003Ctd\u003E3.0\u003C/td\u003E\n\u003Ctd\u003E35\u003C/td\u003E\n\u003Ctd\u003E18.6\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003Eryzen-9-9950x-rtx-5080\u003C/td\u003E\n\u003Ctd\u003Evulkan\u003C/td\u003E\n\u003Ctd\u003E131.9\u003C/td\u003E\n\u003Ctd\u003E816\u003C/td\u003E\n\u003Ctd\u003E20.3\u003C/td\u003E\n\u003C/tr\u003E\n\u003C/tbody\u003E\n\u003C/table\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cem\u003EOwn-memory speed\u003C/em\u003E is the device reading and writing its own memory (the\nSTREAM convention, read+write counted). \u003Cem\u003ETransfer-in\u003C/em\u003E is data crossing\ninto the device; on CPUs and unified memory the two are the same memory,\nso a gap between the columns is the PCIe link of a discrete card.\u003C/span\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"the-cost-curves\"\u003EThe cost curves\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThree questions, one chart each, per model. \u003Cstrong\u003EPrompt reading\u003C/strong\u003E: how long\nuntil the model has read a prompt of a given length? (Log-log; a straight\nline means cost grows in step with length \u2014 an upward bend is attention\ngetting quadratic.) \u003Cstrong\u003EGeneration\u003C/strong\u003E: how many tokens per second, and how\nmuch does a fuller context slow it? \u003Cstrong\u003EMemory\u003C/strong\u003E: how much RAM does context\nitself cost? Lines are machine \u00b7 provider; short lines ran out of sweep\nbudget on slow silicon, not out of data.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe \u003Cstrong\u003E\u25c6 diamonds\u003C/strong\u003E are not part of the sweep \u2014 they are the validation\njob, a real chat-templated workload, placed at its prompt length. A\ndiamond on its line is the sweep predicting reality; a diamond off it is\nthe synthetic-vs-real gap, shown rather than assumed away.\u003C/span\u003E\u003C/span\u003E\u003Cstyle\u003E#curves-qwen3-5-4b:checked~.sw-body [data-p=curves-qwen3-5-4b]{display:block}#curves-qwen3-5-4b:checked~.sw-bar [for=curves-qwen3-5-4b]{background:var(--sw-active-bg);border-color:var(--sw-accent);color:var(--sw-active-fg);font-weight:600}#curves-gemma4-e2b:checked~.sw-body [data-p=curves-gemma4-e2b]{display:block}#curves-gemma4-e2b:checked~.sw-bar [for=curves-gemma4-e2b]{background:var(--sw-active-bg);border-color:var(--sw-accent);color:var(--sw-active-fg);font-weight:600}#curves-gemma4-e2b-qat:checked~.sw-body [data-p=curves-gemma4-e2b-qat]{display:block}#curves-gemma4-e2b-qat:checked~.sw-bar [for=curves-gemma4-e2b-qat]{back hifted time from a continuous drift to discrete, manageable blocks.\n*   **Global Standardization:** In 1884, an international conference established the **Prime Meridian** at Greenwich as the reference point (0\u00b0 longitude) and defined the world into 24 time zones, each 15 degrees wide. While national borders often distorted these ideal zones, the framework was established.\n*   **Daylight Saving Time:** The\u003C/blockquote\u003E\u003Cblockquote\u003E\u003Cspan class=\"who\"\u003ECore Ultra 5 125U (Intel Graphics) \u00b7 gemma4-E2B q4 \u00b7 vulkan\u003C/span\u003EThis document provides a historical overview of the transition from local solar time to a standardized, global system of civil time, emphasizing the role of technology and coordination in this change.\n\n**Key Stages and Developments:**\n\n1. **Local Solar Time (Ancient to 19th Century):** For most of human history, time was strictly local, determined by the position of the Sun (noon being when the Sun was highest). This created a patchwork of time, with different towns keeping their own clocks based on local sundials. These small discrepancies were manageable in a world moving at the pace of horses and sailing ships.\n\n2. **The Breakdown (19th Century):** The invention of the railway shattered this local system. Trains required precise, common schedules, making local solar time incompatible. This necessity drove the need for a universal reference.\n\n3. **Standardization in Britain:** Britain adopted a single standard based on the time kept at the Royal Observatory in Greenwich, establishing Greenwich Mean Time (GMT) as the civil time for the entire rail network.\n\n4. **Standardization in North America:** The US and Canada faced a similar challenge. Railways agreed to divide the continent into broad time zones, spaced roughly an hour apart, to ensure consistency across the vast geography.\u003C/blockquote\u003E\u003Cblockquote\u003E\u003Cspan class=\"who\"\u003ECore Ultra 5 125U (Intel Graphics) \u00b7 gemma4-E4B q4 \u00b7 vulkan\u003C/span\u003EHere is a summary of the document:\n\nThe document traces the profound historical shift in how humanity measures and understands time, moving from a **strictly local, solar-based system** to a **globally coordinated, standardized system**.\n\n**Early Time (Local Solar Time):**\nFor most of human history, time was determined by the Sun\u0026#x27;s position overhead. Because the Sun\u0026#x27;s highest point (noon) varied by location, every town effectively kept its own \u0026quot;local clock,\u0026quot; and small discrepancies were manageable for a slow-moving society.\n\n**The Catalyst for Change (The Railway):**\nThe invention and expansion of the railway in the 19th century shattered this local system. Fast-moving trains required precise, shared schedules, making the chaos of multiple local times deadly and impractical.\n\n**The Standardization Process:**\n1. **Britain:** The railway industry imposed a single standard\u2014**Greenwich Time**\u2014across the entire network, effectively breaking the ancient link between the hour and the Sun\u0026#x27;s position.\n2. **North America:** Due to its vast size, the US and Canada adopted a system of **time zones** (roughly one hour apart) to manage the massive variation in solar time across the continent.\n3. **Techn\u003C/blockquote\u003E\u003Cblockquote\u003E\u003Cspan class=\"who\"\u003ECore Ultra 5 125U (Intel Graphics) \u00b7 gemma4-E2B-qat q2 \u00b7 vulkan\u003C/span\u003EThis document is a detailed historical overview of the evolution of timekeeping, from local solar time to the establishment of standardized time systems.\n\nHere is a summary of the key themes and concepts discussed in the text:\n\n**1. The Local Time Era:**\n* The text begins by describing the historical reliance on local solar time, where timekeeping was based on the sun\u0026#x27;s position.\n* **Local Time:** The text describes how time was once strictly local, with different towns having different local times.\n\n**2. The Problem with Local Time:**\n* The text highlights the inherent instability and potential for local time to be a liability, especially when dealing with modern systems like railways.\n\n**3. The Need for Standardization:**\n* The text details the transition from local time to a global standard. The text discusses the challenges posed by the railway system and the need for a common reference.\n\n**4. The Solution (Standardization):**\n* **Railway Time:** The text notes the shift in the railway system, where local time was replaced by a standardized system (e. Greenwich time) to ensure coordination and safety.\n* **Atomic Time:** The text also discusses the modern solution\u2014atomic clocks\u2014which provide a more precise, universal standard.\u003C/blockquote\u003E\u003C/details\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"gpu-vs-cpu-on-the-same-silicon\"\u003EGPU vs CPU on the same silicon\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EWhat does falling back to the CPU cost? The two phases stress different\nhardware: reading the prompt is parallel math (the GPU's home game);\ngenerating tokens is bounded by memory speed, where CPUs are closer than\ntheir reputation. Measured across these machines: the GPU reads prompts \u003Cstrong\u003E\u00d70.9\u201333\u003C/strong\u003E faster but generates only \u003Cstrong\u003E\u00d70.3\u201312.1\u003C/strong\u003E faster. A fallback\ndoesn't slow everything equally \u2014 the prompt side moves most.\u003C/span\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003Emachine\u003C/th\u003E\n\u003Cth\u003EGPU\u003C/th\u003E\n\u003Cth\u003Eprompt reading\u003C/th\u003E\n\u003Cth\u003Egeneration\u003C/th\u003E\n\u003Cth\u003Efull turn\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003ECore Ultra 5 125U (Intel Graphics)\u003C/td\u003E\n\u003Ctd\u003Evulkan\u003C/td\u003E\n\u003Ctd\u003E\
