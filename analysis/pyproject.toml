[project]
name = "bench-analysis"
version = "0.1.0"
description = "Load + compare on-device benchmark results across machines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",       # tidy frame over the per-machine results JSON
    "altair>=6.0",       # charts as vega-lite specs; the site embeds them
    "jinja2>=3.1",       # the report is jinja templates over computed context
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench_analysis"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
