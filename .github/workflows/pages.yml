# Publish the committed benchmark report (results/published/report.html) as the
# GitHub Pages site. The report is regenerated locally as part of the submission
# flow; this workflow only serves the committed file as index.html.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Stage the report as the site root
        # A placeholder until the first submission regenerates the report.
        run: |
          mkdir -p _site
          if [ -f results/published/report.html ]; then
            cp results/published/report.html _site/index.html
          else
            echo '<h1>No submissions yet</h1>' > _site/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
