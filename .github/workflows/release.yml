# Build the per-platform contributor kits (packaging/package.sh) on a tag push
# and attach them to the GitHub Release. The release tag is the compatibility
# anchor: it pins the llama.cpp commit, the schema versions, and the harness
# revision together — `bench ingest` checks submissions against it.
# workflow_dispatch builds the same artifacts without publishing (dry run).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # attach assets to the release

env:
  # 1.4.313+ on Windows ships the SPIRV-Headers/SPIRV-Tools CMake package
  # configs ggml-vulkan find_package()s; older SDKs don't.
  VULKAN_SDK_VERSION: "1.4.313.2"

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 on purpose: building there sets the glibc floor (2.35)
          # low enough for contributor boxes from ~2022 onward.
          - { os: ubuntu-22.04, target: linux-x64 }
          - { os: macos-15, target: macos-arm64 }
          - { os: windows-2025, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Vulkan SDK (linux)
        if: matrix.target == 'linux-x64'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc >/dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update && sudo apt-get install -y vulkan-sdk

      - name: Enable git long paths (windows)
        # llama.cpp's UI tree nests past MAX_PATH; FetchContent's clone dies
        # with "Filename too long" without this.
        if: matrix.target == 'windows-x64'
        run: git config --global core.longpaths true

      - name: Vulkan SDK (windows)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          curl.exe -fLo "$env:RUNNER_TEMP/vulkan-sdk.exe" `
            "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          & "$env:RUNNER_TEMP/vulkan-sdk.exe" --accept-licenses --default-answer --confirm-command install | Out-Null
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_SDK_VERSION" >> $env:GITHUB_ENV
          "CMAKE_PREFIX_PATH=C:\VulkanSDK\$env:VULKAN_SDK_VERSION" >> $env:GITHUB_ENV
          "C:\VulkanSDK\$env:VULKAN_SDK_VERSION\Bin" >> $env:GITHUB_PATH

      - name: Package
        shell: bash
        run: packaging/package.sh ${{ matrix.target }} ${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.target }}
          path: |
            dist/bench-*.tar.gz
            dist/bench-*.zip
            dist/bench-*.sha256
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bench-*.tar.gz
            dist/bench-*.zip
            dist/bench-*.sha256
