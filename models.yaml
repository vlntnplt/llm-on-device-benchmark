# Model registry — what the benchmark runs on, and where `bench fetch` pulls it
# from (into the untracked models/<name>/{gguf,onnx}/; both stacks consume those
# repo trees directly). Exes never read this file: the harness resolves the
# artifact path and hands the exe --model/--quant/--ep.
#
# Per model, up to two backend blocks — gguf (for ggml) and onnx (for tjs) —
# each naming a Hub repo, a `common` glob list (shared config/tokenizer), and a
# `quants` map. The quant key IS the wire enum (fp16|q8|q4|q4f16) — no
# normalization; one variant per declared quant actually fetched, and a
# declared-but-unfetched quant is skipped with a loud warning, never silently.
# Note a label is not identical math across stacks (ggml q4 = Q4_K_M,
# tjs q4 = MatMulNBits): compare within a label, qualified by stack versions.

gemma4-E2B:
  onnx:
    repo: https://huggingface.co/onnx-community/gemma-4-E2B-it-ONNX
    common: ["*.json"]
    quants:
      q4: { files: ["onnx/*q4.onnx", "onnx/*q4.onnx_data*"] }
  gguf:
    repo: https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF
    common: ["config.json"]
    quants:
      q4: { files: ["gemma-4-E2B-it-Q4_K_M.gguf"] }
gemma4-E4B:
  onnx:
    repo: https://huggingface.co/onnx-community/gemma-4-E4B-it-ONNX
    common: ["*.json"]
    quants:
      q4: { files: ["onnx/*q4.onnx", "onnx/*q4.onnx_data*"] }
  gguf:
    repo: https://huggingface.co/unsloth/gemma-4-E4B-it-GGUF
    common: ["config.json"]
    quants:
      q4: { files: ["gemma-4-E4B-it-Q4_K_M.gguf"] }
Qwen3.5-4B:
  onnx:
    repo: https://huggingface.co/onnx-community/Qwen3.5-4B-ONNX
    common: ["*.json"]
    quants:
      q4:    { files: ["onnx/*q4.onnx",    "onnx/*q4.onnx_data*"] }
  gguf:
    repo: https://huggingface.co/unsloth/Qwen3.5-4B-GGUF
    common: ["config.json"]
    quants:
      q4: { files: ["Qwen3.5-4B-Q4_K_M.gguf"] }
