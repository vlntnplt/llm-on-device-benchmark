[project]
name = "bench"
version = "0.1.0"
description = "Backend-agnostic harness for the on-device LLM inference benchmark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psutil>=6.0",       # RSS sampling (memory_info) over the process tree
    "nvidia-ml-py>=12.0", # per-PID VRAM on NVIDIA (NVML)
    "pyyaml>=6.0",       # parse model cards + task definitions
    "jsonschema>=4.0",   # validate events + results against the repo-root schema/
    "huggingface-hub>=0.25", # bench fetch — pull model vaults from the Hub
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
bench = "bench.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]
